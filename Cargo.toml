[package]
name = "binview"
version = "0.1.0"
edition = "2021"
description = "Museum-grade monochrome Rust desktop binary analysis & visualization studio"

[dependencies]
eframe = "0.29"
egui = "0.29"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.15"
dirs = "5"
arboard = { version = "3", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
